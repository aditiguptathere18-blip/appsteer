<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static',filename='dashboard.css') }}">

</head>

<body>

<div class="container">

    <h1>Welcome to Dashboard</h1>

    <h2>Welcome {{ session['user'] }}</h2>

    <h3 style="text-align:center;">
        Admin Dashboard
    </h3>


    <!-- STATS CARDS -->

    <div class="stats-container">

        <div class="card">

            <h3>Total Attendance</h3>

            <h2>{{ total_attendance }}</h2>

        </div>


        <div class="card">

            <h3>Total Productivity</h3>

            <h2>{{ total_productivity }}</h2>

        </div>


        <div class="card">

            <h3>Total Duration</h3>

            <h2>{{ total_duration }} mins</h2>

        </div>


        <div class="card">

            <h3>Total Employees</h3>

            <h2>{{ total_users }}</h2>

        </div>

    </div>


    <!-- BUTTONS -->

    <div class="btn-group">

        <a href="/attendance">
            <button>Mark Attendance</button>
        </a>


        <a href="/view_attendance">
            <button>View Attendance</button>
        </a>


        <a href="/productivity">
            <button>Add Productivity</button>
        </a>


        <a href="/view_productivity">
            <button>View Productivity</button>
        </a>


        <a href="/add_user">
            <button>Add Employee</button>
        </a>


        <a href="/view_users">
            <button>View Users</button>
        </a>


        <a href="/logout">
            <button class="logout">
                Logout
            </button>
        </a>

    </div>

</div>

</body>
</html>
